# Builds the debug app on GitHub's computers every time code is pushed,
# then publishes it as a pre-release called "Latest debug build".
# Download it from the repo's Releases page (right-hand side on GitHub).
name: Build debug APK

on:
  push:
  workflow_dispatch:

# Allows this workflow to create releases in the repo.
permissions:
  contents: write

# If two pushes happen close together, finish them one at a time so they
# don't both try to replace the release at once.
concurrency:
  group: debug-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, to count releases since the version base last changed.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The version people see starts at appVersionBase.0: the commit that last
      # changed appVersionBase is .0 and each commit after it adds one (on main
      # every merge is one commit). The patch never reaches 70: after x.y.69
      # comes x.(y+1).0. The run number stays the hidden versionCode, so
      # updates always count as newer.
      - name: Work out the version
        run: |
          BASE=$(grep '^appVersionBase=' gradle.properties | cut -d= -f2)
          START=$(git log -1 --format=%H -G '^appVersionBase=' -- gradle.properties)
          COUNT=$(git rev-list --count "$START"..HEAD)
          MAJOR=${BASE%%.*}
          MINOR=$(( ${BASE#*.} + COUNT / 70 ))
          PATCH=$(( COUNT % 70 ))
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION (versionCode $GITHUB_RUN_NUMBER)"

      - name: Build and test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest -PbuildNumber=${{ github.run_number }} -PversionLabel=$VERSION

      # The screen pictures the tests draw (app/build/outputs/roborazzi), kept
      # for a few days so layouts can be checked without a phone.
      - name: Keep screen pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi
          retention-days: 3
          if-no-files-found: ignore

      # Replace the previous "Latest debug build" pre-release with this one.
      # It holds the app (named with its version) and latest.json, the small
      # file the app reads to find out whether a newer version exists.
      # Releases don't count toward the Actions storage quota.
      # Only builds of main are published, so unfinished work on other
      # branches never shows up on the phone as an "Update available".
      - name: Publish pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="binder-tracker-v$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/debug-latest/$APK"
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$VERSION" "$APK_URL" > latest.json
          cat latest.json
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest "$APK" latest.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build v$VERSION" \
            --notes "Version $VERSION, built from branch \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA::7}). Install $APK on your phone. Already have the app? It will offer this update by itself."
