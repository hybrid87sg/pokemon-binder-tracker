# Builds the debug app on GitHub's computers every time code is pushed.
# Download the finished app from the run's "Artifacts" section.
name: Build debug APK

# Runs once per push (pushes to a pull request's branch are covered too).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest

      # Uploads share the account's GitHub storage quota, so keep them for
      # 7 days only, and don't mark the build as failed if the quota is full.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: binder-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
