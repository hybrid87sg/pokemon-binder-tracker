# Builds the debug app on GitHub's computers every time code is pushed.
# Download the finished app from the run's "Artifacts" section.
name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: binder-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
