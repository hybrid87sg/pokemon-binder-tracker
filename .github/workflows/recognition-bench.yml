# Scores card recognition on fake phone photos (scripts/recognition_bench.py)
# and shows the results table on the run's Summary page.
# Runs when the bench changes, or by hand from the Actions tab.
name: Recognition bench

on:
  push:
    paths:
      - scripts/recognition_bench.py
      - .github/workflows/recognition-bench.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgles2
          pip install mediapipe==1.2.3 opencv-python-headless==4.14.0.94 numpy pillow requests

      - name: Score recognition
        run: python scripts/recognition_bench.py --model app/src/main/assets/card_embedder.tflite --summary "$GITHUB_STEP_SUMMARY"
